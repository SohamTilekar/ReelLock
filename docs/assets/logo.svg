<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281C8C"/>
      <stop offset="100%" stop-color="#170F5E"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Rect Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Border -->
    <path d="M 256 96 L 128 152 V 264 C 128 344 192 408 256 432 C 320 408 384 344 384 264 V 152 Z" fill="#FFFFFF"/>
    
    <!-- Inner Shield Left Half -->
    <path d="M 256 124 L 152 170 V 264 C 152 328 204 380 256 400 Z" fill="#3224A8"/>
    
    <!-- Inner Shield Right Half (Shadow Side) -->
    <path d="M 256 124 L 360 170 V 264 C 360 328 308 380 256 400 Z" fill="#241787"/>
    
    <!-- Center Padlock Body -->
    <rect x="196" y="240" width="120" height="96" rx="16" fill="#FFFFFF"/>
    
    <!-- Padlock Shackle -->
    <path d="M 216 240 V 212 C 216 190 234 172 256 172 C 278 172 296 190 296 212 V 240" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Keyhole Detail -->
    <circle cx="256" cy="276" r="14" fill="#170F5E"/>
    <path d="M 250 276 L 246 312 H 266 L 262 276 Z" fill="#170F5E"/>
  </g>
</svg>
